# =============================================================================
# Test Workflow
# =============================================================================
#
# Runs unit tests and integration tests for all actions in this repository.
# Triggered on every push and pull request.
#
# =============================================================================

name: Test

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Unit Tests - Test the ESLint plugin directly
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run plugin tests
        working-directory: actions/eslint-js-prefix/plugin
        run: |
          npm install
          npm test

  # ---------------------------------------------------------------------------
  # Integration Tests - Test the full GitHub Action
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - name: project-clean
            expected-violations: 0
            should-fail: false
          - name: project-violations
            expected-violations: 5
            should-fail: true
    steps:
      - uses: actions/checkout@v6

      - name: Run action on ${{ matrix.fixture.name }}
        id: lint
        uses: ./actions/eslint-js-prefix
        continue-on-error: true
        with:
          working-directory: tests/fixtures/eslint-js-prefix/${{ matrix.fixture.name }}

      - name: Verify results
        run: |
          VIOLATIONS="${{ steps.lint.outputs.violations }}"
          EXPECTED="${{ matrix.fixture.expected-violations }}"
          SHOULD_FAIL="${{ matrix.fixture.should-fail }}"
          OUTCOME="${{ steps.lint.outcome }}"

          echo "Violations: $VIOLATIONS (expected: $EXPECTED)"
          echo "Outcome: $OUTCOME (should fail: $SHOULD_FAIL)"

          # Check violation count
          if [[ "$VIOLATIONS" != "$EXPECTED" ]]; then
            echo "❌ Wrong violation count"
            exit 1
          fi

          # Check exit status matches expectation
          if [[ "$SHOULD_FAIL" == "true" && "$OUTCOME" != "failure" ]]; then
            echo "❌ Action should have failed"
            exit 1
          fi
          if [[ "$SHOULD_FAIL" == "false" && "$OUTCOME" != "success" ]]; then
            echo "❌ Action should have succeeded"
            exit 1
          fi

          echo "✅ Test passed"

  # ---------------------------------------------------------------------------
  # Framework Detection Test - Verify auto-detection works
  # ---------------------------------------------------------------------------
  framework-detection:
    name: Framework Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test with React project (auto-detect on)
        uses: ./actions/eslint-js-prefix
        with:
          working-directory: tests/fixtures/eslint-js-prefix/project-clean
          # auto-detect: true (default) - should detect React and allow data-testid

  # ---------------------------------------------------------------------------
  # Security Scan - Python pip
  # ---------------------------------------------------------------------------
  security-scan-python-pip:
    name: Security Scan - Python (pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run security scan on Python fixture
        id: scan
        uses: ./actions/security-scan
        with:
          working-directory: tests/fixtures/security-scan/python-pip
          scan-npm: 'false'
          severity-threshold: 'low'

      - name: Verify Python results
        run: |
          COUNT="${{ steps.scan.outputs.total-vulnerabilities }}"
          HAS="${{ steps.scan.outputs.has-vulnerabilities }}"

          echo "Vulnerabilities: $COUNT"
          echo "Has vulnerabilities: $HAS"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "❌ Expected vulnerabilities > 0"
            exit 1
          fi

          if [[ "$HAS" != "true" ]]; then
            echo "❌ Expected has-vulnerabilities to be true"
            exit 1
          fi

          echo "✅ Python scan test passed"

  # ---------------------------------------------------------------------------
  # Security Scan - NPM
  # ---------------------------------------------------------------------------
  security-scan-npm:
    name: Security Scan - NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run security scan on NPM fixture
        id: scan
        uses: ./actions/security-scan
        with:
          working-directory: tests/fixtures/security-scan/npm-vulnerable
          scan-python: 'false'
          severity-threshold: 'low'

      - name: Verify NPM results
        run: |
          COUNT="${{ steps.scan.outputs.total-vulnerabilities }}"
          HAS="${{ steps.scan.outputs.has-vulnerabilities }}"

          echo "Vulnerabilities: $COUNT"
          echo "Has vulnerabilities: $HAS"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "❌ Expected vulnerabilities > 0"
            exit 1
          fi

          if [[ "$HAS" != "true" ]]; then
            echo "❌ Expected has-vulnerabilities to be true"
            exit 1
          fi

          echo "✅ NPM scan test passed"

  # ---------------------------------------------------------------------------
  # Security Scan - Skip All
  # ---------------------------------------------------------------------------
  security-scan-skip-all:
    name: Security Scan - Skip All
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run security scan with all scans disabled
        id: scan
        uses: ./actions/security-scan
        with:
          scan-python: 'false'
          scan-npm: 'false'

      - name: Verify skip results
        run: |
          COUNT="${{ steps.scan.outputs.total-vulnerabilities }}"
          HAS="${{ steps.scan.outputs.has-vulnerabilities }}"

          echo "Vulnerabilities: $COUNT"
          echo "Has vulnerabilities: $HAS"

          if [[ "$COUNT" -ne 0 ]]; then
            echo "❌ Expected total = 0 when all scans skipped"
            exit 1
          fi

          if [[ "$HAS" != "false" ]]; then
            echo "❌ Expected has-vulnerabilities to be false"
            exit 1
          fi

          echo "✅ Skip-all test passed"

  # ---------------------------------------------------------------------------
  # Final Check - All tests must pass
  # ---------------------------------------------------------------------------
  all-tests-passed:
    name: All Tests Passed
    needs: [unit-tests, integration-tests, framework-detection, security-scan-python-pip, security-scan-npm, security-scan-skip-all]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All tests passed!"
